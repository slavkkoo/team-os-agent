# /etc/ssh/sshd_config.d/99-hardening.conf — вход только по ключу.
# Публичный VPS с паролем root получает десятки тысяч попыток подбора в неделю.
# ПЕРЕД применением: убедитесь, что вход по ключу работает в ОТДЕЛЬНОЙ сессии,
# и знайте, где у провайдера аварийная веб-консоль (VNC/serial) на случай потери ключа.
# Применить: sshd -t && systemctl reload ssh
PasswordAuthentication no
PermitRootLogin prohibit-password
KbdInteractiveAuthentication no
